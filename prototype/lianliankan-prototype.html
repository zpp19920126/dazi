<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,
  user-scalable=no, viewport-fit=cover">
<title>连连看小公主</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none;
      user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; touch-action:manipulation; overscroll-behavior:none; }
  body { font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
    background:linear-gradient(180deg,#FFE4F0,#F3E8FF); overflow:hidden; }
  #app { height:100dvh; padding:env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left); }
  section { display:none; height:100%; }
  section.on { display:flex; flex-direction:column; }
  /* === VIEW 视觉基座（T6，spec§4/§6） === */
  .bg-deco { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .cloud { position:absolute; width:26vw; height:10vw; border-radius:50%;
    background:rgba(255,255,255,.5); animation:drift 60s linear infinite; }
  @keyframes drift { from{transform:translateX(-30vw)} to{transform:translateX(110vw)} }
  #scr-game { padding:2vw; }
  .topbar { display:flex; align-items:center; height:6vh; font-size:16px; }
  #board-wrap { position:relative; flex:1; display:flex; align-items:center; justify-content:center; }
  #board { display:grid; gap:var(--gap,2.5vw); width:100%; max-width:var(--maxw,92vw);
    grid-template-columns:repeat(var(--cols),1fr); }
  .card { aspect-ratio:1; background:#fff; border:2px solid #FFB6D9; border-radius:22%;
    box-shadow:0 4px 12px rgba(255,150,200,.35); display:flex; align-items:center;
    justify-content:center; font-size:clamp(28px,9vw,64px); transition:transform .15s; }
  .card.sel { border-color:#FFD700; box-shadow:0 0 16px #FFD700; transform:scale(1.15); }
  .card.shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)}
    75%{transform:rotate(6deg)} }
  .card.pop { animation:pop .35s forwards; }
  @keyframes pop { 60%{transform:scale(1.2);opacity:1} 100%{transform:scale(0);opacity:0} }
  #lines { position:absolute; inset:0; pointer-events:none; }
  /* === T7 彩虹连线 / 粒子 === */
  .flow { stroke-dasharray:12 8; animation:dash .4s linear; }
  @keyframes dash { from{stroke-dashoffset:20} to{stroke-dashoffset:0} }
  .spark { position:fixed; font-size:18px; pointer-events:none; z-index:20;
    animation:fly .6s forwards; }
  @keyframes fly { to{transform:translate(var(--dx),var(--dy));opacity:0} }
  #scr-win { position:relative; overflow:hidden; }
  .conf { position:absolute; top:-5vh; pointer-events:none; z-index:20; font-size:20px;
    animation:fall 2s linear forwards; }
  @keyframes fall { to{transform:translateY(110vh) rotate(360deg)} }
  /* === T9 五屏 App（brief CSS 块 + 屏样式，spec§4 线框） === */
  .big-btn { width:40vw; height:40vw; border-radius:50%; border:none; font-size:24px;
    background:radial-gradient(circle at 35% 30%,#FFC6DD,#FF7AB6); color:#fff;
    box-shadow:0 8px 24px rgba(255,122,182,.5); margin:auto; }
  .breathe { animation:breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50%{transform:scale(1.08);box-shadow:0 0 20px #FFD700} }
  .node { position:absolute; width:13vw; height:13vw; border-radius:50%; background:#fff;
    border:3px solid #FFB6D9; display:flex; align-items:center; justify-content:center;
    font-size:22px; }
  .node.done { border-color:#FFD700; } .node.locked { opacity:.45; }
  #teach { position:absolute; inset:0; background:rgba(255,228,240,.75); display:flex;
    align-items:center; justify-content:center; font-size:22px; color:#B0447A; }
  .reshuffle { animation:flip .8s; } @keyframes flip { 50%{transform:rotateY(180deg) scale(1.1)} }
  /* 屏布局 */
  #scr-open { align-items:center; justify-content:center; gap:9vh; }
  #scr-open .logo { font-size:26vw; line-height:1; touch-action:none;
    filter:drop-shadow(0 6px 16px rgba(255,122,182,.45)); }
  #scr-map .map-area { position:relative; flex:1; }
  .topbar .back { background:none; border:none; font-size:26px; color:#B0447A;
    width:44px; height:44px; }
  .topbar .stars { font-size:16px; color:#B0447A; margin-left:auto; margin-right:12px; }
  .topbar .hint { background:none; border:none; font-size:26px; width:44px; }
  .topbar .hint.dim { opacity:.35; pointer-events:none; }
  .node.current { border-color:#FF7AB6; }
  .node { color:#B0447A; font-weight:600; }
  #scr-win { align-items:center; justify-content:center; gap:3vh; }
  .win-big { font-size:22vw; line-height:1; }
  .win-text { font-size:32px; color:#B0447A; text-align:center; }
  .win-sub { font-size:20px; color:#FF7AB6; }
  #teach { z-index:5; border-radius:16px; transition:opacity .35s; flex-direction:column;
    gap:2vh; text-align:center; padding:4vw; }
  #scr-parent { align-items:flex-start; justify-content:center; gap:18px; padding:8vw;
    color:#B0447A; }
  #scr-parent h2 { font-size:22px; }
  #scr-parent .pk-row { font-size:18px; display:flex; align-items:center; gap:10px; }
  #scr-parent .pk-row input { width:22px; height:22px; accent-color:#FF7AB6; }
  .pk-btn { font-size:16px; color:#fff; background:#FF7AB6; border:none;
    border-radius:14px; padding:10px 18px; }
  .pk-note { font-size:12px; color:#c08aa8; } /* 家长页允许小字（spec§4⑤） */
</style>
</head>
<body>
<div id="app">
  <section id="scr-open">
    <div class="logo" id="logo">🦄</div>
    <button class="big-btn" id="btn-start">开始玩!</button>
  </section>
  <section id="scr-map">
    <div class="topbar"><button class="back" id="map-back">←</button>
      <span class="stars"></span></div>
    <div class="map-area"></div>
  </section>
  <section id="scr-game"></section>
  <section id="scr-win">
    <div class="win-big">🌈</div>
    <h1 class="win-text"></h1>
    <div class="win-sub">☆ 点我继续 ☆</div>
  </section>
  <section id="scr-parent">
    <h2>家长设置</h2>
    <label class="pk-row"><input type="checkbox" id="pk-sound"> 音效</label>
    <label class="pk-row"><input type="checkbox" id="pk-voice"> 鼓励语音</label>
    <button id="pk-reset" class="pk-btn">重置进度</button>
    <button id="pk-back" class="pk-btn">返回</button>
    <p class="pk-note">长按 Unicorn 图案 3 秒进入本页。</p>
  </section>
</div>
<script>
/* === ENGINE START === */
const POOL = ['🦄','🐰','🐱','🦊','🐼','🌈','⭐','🎀','🍓','🧁','🍭','🌸'];
const MAXTURNS = { free:null, oneTurn:1, classic:2 };
const LEVELS = [
  { id:1, rows:3, cols:4, kinds:4,  rule:'free' },
  { id:2, rows:3, cols:4, kinds:5,  rule:'free' },
  { id:3, rows:4, cols:4, kinds:6,  rule:'free' },
  { id:4, rows:4, cols:4, kinds:6,  rule:'oneTurn' },
  { id:5, rows:4, cols:5, kinds:7,  rule:'oneTurn' },
  { id:6, rows:4, cols:5, kinds:8,  rule:'oneTurn' },
  { id:7, rows:4, cols:6, kinds:9,  rule:'classic', hint:1 },
  { id:8, rows:5, cols:6, kinds:10, rule:'classic', hint:1 },
  { id:9, rows:5, cols:6, kinds:10, rule:'classic', hint:1 },
];
function findPath(rows, cols, alive, a, b, maxTurns) {
  const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
  const key = (r,c) => r + ',' + c;
  const canPass = (r,c) => {
    if (r < -1 || r > rows || c < -1 || c > cols) return false;      // 只允许一圈虚拟外圈
    if (r === b.r && c === b.c) return true;                          // 终点卡可进入
    if (r < 0 || r >= rows || c < 0 || c >= cols) return true;        // 外圈恒空
    return !alive(r,c);
  };
  const parent = new Map([[key(a.r,a.c), null]]);
  let frontier = [[a.r, a.c, -1]];
  for (let turn = 0; turn <= maxTurns && frontier.length; turn++) {
    const next = [];
    for (const [r0,c0,d0] of frontier) {
      for (let d = 0; d < 4; d++) {
        if (d0 >= 0 && (d === d0 || d === (d0 ^ 1))) continue; // 直线已在射线内覆盖；不走回头（DIRS 中相对方向相邻，反向 = d0^1 而非 (d0+2)%4）
        let r = r0, c = c0;
        while (canPass(r + DIRS[d][0], c + DIRS[d][1])) {
          r += DIRS[d][0]; c += DIRS[d][1];
          const k = key(r,c);
          if (!parent.has(k)) {
            parent.set(k, [r0, c0]); // 折点记录线段起点，重建后压缩共线
            if (!(r === b.r && c === b.c)) next.push([r, c, d]);
          }
          if (r === b.r && c === b.c) break;
        }
      }
    }
    frontier = next;
  }
  if (!parent.has(key(b.r,b.c))) return null;
  const pts = []; // 从b回溯到a
  let cur = [b.r,b.c];
  while (cur) { pts.push({ r:cur[0], c:cur[1] });
    const p = parent.get(key(cur[0],cur[1])); cur = p; }
  pts.reverse();
  const out = []; // 共线压缩
  for (const p of pts) {
    const n = out.length;
    if (n >= 2) { const [a1,a2] = [out[n-2],out[n-1]];
      const collinear = (a1.r===a2.r && a2.r===p.r) || (a1.c===a2.c && a2.c===p.c);
      if (collinear) { out[n-1] = p; continue; } }
    out.push(p);
  }
  return out;
}
function aliveFn(cells) { return (r,c) => cells[r][c] != null; }
function pairsOf(cells, rows, cols) {
  const byKind = new Map();
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const v = cells[r][c]; if (v == null) continue;
    if (!byKind.has(v)) byKind.set(v, []); byKind.get(v).push({ r, c });
  }
  const pairs = [];
  for (const list of byKind.values())
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++)
      pairs.push([list[i], list[j]]);
  return pairs;
}
function hasAvailablePair(cells, rows, cols, rule) {
  if (rule === 'free') { const p = pairsOf(cells, rows, cols); return p[0] || null; }
  const mt = MAXTURNS[rule], alive = aliveFn(cells);
  for (const [a, b] of pairsOf(cells, rows, cols))
    if (findPath(rows, cols, alive, a, b, mt)) return [a, b];
  return null;
}
const findHint = hasAvailablePair;
function shuffleArr(arr, rand) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr;
}
function generateBoard(level, rand) {
  const pool = shuffleArr([...POOL.keys()], rand).slice(0, level.kinds);
  const total = level.rows * level.cols, bag = [];
  for (let i = 0; i < total / 2; i++) { const k = pool[i % pool.length]; bag.push(k, k); }
  for (let t = 0; t <= 50; t++) {
    shuffleArr(bag, rand);
    const g = Array.from({ length: level.rows }, (_, r) =>
      bag.slice(r * level.cols, (r + 1) * level.cols));
    let rule = level.rule;
    if (t === 50) rule = 'free'; // spec§8 降级：不再校验可解性
    else if (rule !== 'free' && !hasAvailablePair(g, level.rows, level.cols, rule)) continue;
    return { cells: g, rule, degraded: t === 50 };
  }
}
function reshuffle(cells, rows, cols, rule, rand) {
  const pos = [], vals = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    if (cells[r][c] != null) { pos.push([r, c]); vals.push(cells[r][c]); }
  for (let t = 0; t <= 50; t++) {
    shuffleArr(vals, rand);
    const g = cells.map(row => row.map(() => null));
    pos.forEach(([r, c], i) => { g[r][c] = vals[i]; });
    if (rule === 'free' || hasAvailablePair(g, rows, cols, rule)) return g;
  }
  return cells; // 理论上到不了：free保底已在循环内；全失败则原样返回由view静默重试
}
function attempt(cells, rows, cols, rule, a, b) {
  if (a.r === b.r && a.c === b.c) return { type: 'diff' };          // 点同一格按无效对待
  if (cells[a.r][a.c] !== cells[b.r][b.c]) return { type: 'diff' };
  if (rule === 'free') return { type: 'match', path: [a, b] };
  const path = findPath(rows, cols, aliveFn(cells), a, b, MAXTURNS[rule]);
  return path ? { type: 'match', path } : { type: 'blocked' };
}
/* === ENGINE END === */
/* === STORE START === */
const STORE_KEY = 'llk-toddler-v1';
const defaultProgress = () => ({ cleared: [], sound: true, voice: true, hintUsed: {} });
function loadProgress(storage) {
  try {
    const d = JSON.parse(storage.getItem(STORE_KEY) || '{}');
    return {
      cleared: Array.isArray(d.cleared) ? d.cleared.filter(n => Number.isInteger(n) && n >= 1 && n <= 9) : [],
      sound: d.sound !== false, voice: d.voice !== false,
      hintUsed: d.hintUsed && typeof d.hintUsed === 'object' ? d.hintUsed : {},
    };
  } catch (e) { return defaultProgress(); }
}
function saveProgress(storage, p) {
  try { storage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) { /* 无痕模式静默 */ }
}
function markCleared(storage, levelId) {
  const p = loadProgress(storage);
  if (!p.cleared.includes(levelId)) p.cleared.push(levelId);
  saveProgress(storage, p); return p;
}
/* === STORE END === */
</script>
<script>
/* === VIEW START === */
// VIEW：视觉基座 + 棋盘网格渲染（纯 DOM/CSS，无游戏流；T7/T9 在此扩展）
(() => {
  const $ = s => document.querySelector(s);
  let rowsN = 0, colsN = 0; // T7 centerOf 需要：buildGame 时记录的棋盘维度
  function decorate() { // 背景飘云（幂等；.bg-deco 为 fixed+pointer-events:none，不挡交互）
    if (document.querySelector('.bg-deco')) return;
    const deco = document.createElement('div');
    deco.className = 'bg-deco';
    [[6, 0], [18, -22], [42, -45], [70, -10]].forEach(([topVh, delayS]) => {
      const c = document.createElement('div');
      c.className = 'cloud';
      c.style.top = topVh + 'vh';
      c.style.animationDelay = delayS + 's';
      deco.appendChild(c);
    });
    document.body.appendChild(deco);
  }
  function buildGame(level) {
    decorate();
    $('#scr-game').innerHTML = `
      <div class="topbar"><button class="back">←</button>
        <span class="stars"></span><button class="hint" hidden>💡</button></div>
      <div id="board-wrap"><div id="board"></div><svg id="lines"></svg></div>`;
    const b = $('#board');
    rowsN = level.rows; colsN = level.cols;
    b.style.setProperty('--cols', colsN);
    b.style.setProperty('--gap', (colsN <= 5 ? 2.5 : 1) + 'vw'); // spec§4③ 宽网格收窄gap保卡宽
    if (colsN >= 6) b.style.setProperty('--maxw', '96vw'); // spec§4③ 6列时保卡片≥15%屏宽
    return b;
  }
  function renderBoard(cells, onTap) {
    const b = $('#board'); b.innerHTML = '';
    cells.forEach((row, r) => row.forEach((v, c) => {
      const d = document.createElement('div');
      d.className = 'card'; d.dataset.r = r; d.dataset.c = c;
      d.textContent = v == null ? '' : POOL[v];
      if (v == null) { d.style.visibility = 'hidden'; }
      d.addEventListener('pointerdown', () => onTap({ r, c }));
      b.appendChild(d);
    }));
  }
  const cellEl = (r, c) => document.querySelector(
    `#board .card[data-r="${r}"][data-c="${c}"]`);
  const setSelected = (el, on) => el && el.classList.toggle('sel', on);
  const shake = el => { el.classList.remove('shake'); void el.offsetWidth;
    el.classList.add('shake'); };
  const vanish = el => { el.classList.add('pop'); setTimeout(
    () => { el.style.visibility = 'hidden'; el.classList.remove('pop'); }, 350); };
  // === T7 彩虹连线 / 星星粒子 / 撒花 ===
  function centerOf(p) {
    const bRect = $('#board').getBoundingClientRect(), one = bRect.width / colsN;
    // 外圈(-1/rows/cols)clamp到板外沿附近，避免绕行点被viewBox裁切
    const clamp = (v, max) => Math.max(-0.4, Math.min(max + 0.4, v));
    return { x: (clamp(p.c, colsN - 1) + 0.5) * one,
      y: (clamp(p.r, rowsN - 1) + 0.5) * one };
  }
  function drawPath(path) {
    const svg = $('#lines'), b = $('#board');
    svg.setAttribute('viewBox', `0 0 ${b.clientWidth} ${b.clientHeight}`);
    // #lines 定位从 wrap 内 inset:0 收缩到与 #board 精确重合（board 居中于 wrap，
    // 若铺满 wrap 则 viewBox 与坐标错位）
    svg.style.left = b.offsetLeft + 'px'; svg.style.top = b.offsetTop + 'px';
    svg.style.width = b.clientWidth + 'px'; svg.style.height = b.clientHeight + 'px';
    const pts = path.map(centerOf).map(p => `${p.x},${p.y}`).join(' ');
    // userSpaceOnUse：直线（竖直/水平）bbox 一边为0，objectBoundingBox 渐变按SVG规范
    // 不渲染（线不可见）；改用用户坐标横跨棋盘宽度，spec 三色不变。
    const grad = `<defs><linearGradient id="rg" gradientUnits="userSpaceOnUse"
      x1="0" x2="${b.clientWidth}">
      <stop offset="0" stop-color="#FF7AB6"/><stop offset=".5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#8ED6FF"/></linearGradient></defs>`;
    svg.innerHTML = grad + `<polyline points="${pts}" fill="none" stroke="url(#rg)"
      stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      class="flow"/>`;
    setTimeout(() => svg.innerHTML = '', 420);
  }
  function burst(el) { const b = el.getBoundingClientRect(), host = $('#app');
    for (let i = 0; i < 6; i++) { const s = document.createElement('span');
      s.className = 'spark'; s.textContent = '⭐';
      s.style.left = b.left + b.width / 2 + 'px'; s.style.top = b.top + b.height / 2 + 'px';
      s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
      s.style.setProperty('--dy', (Math.random() * -80 - 10) + 'px');
      host.appendChild(s); setTimeout(() => s.remove(), 600); } }
  function confetti() { const host = $('#scr-win');
    for (let i = 0; i < 40; i++) { const s = document.createElement('span');
      s.className = 'conf'; s.textContent = ['🎉','✨','🌸','💗'][i % 4];
      s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() + 's';
      host.appendChild(s); setTimeout(() => s.remove(), 2500); } }
  globalThis.View = {
    decorate, buildGame, renderBoard, cellEl, setSelected, shake, vanish,
    dims: () => ({ rows: rowsN, cols: colsN }), // T7 centerOf 用
    centerOf, drawPath, burst, confetti,
  }; // decorate T9 增补导出：开场/地图屏也需飘云背景
})();
/* === VIEW END === */
</script>
<script>
/* === AUDIO START === */
// WebAudio 合成音效 + zh-CN 鼓励语音；首次 pointerdown 建 AudioContext（ autoplay 合规）；
// 全部静默降级（spec§8）：构造失败/未 init/无 speechSynthesis → 空操作不抛错。
// 注意：顶层 const Audio 会在此后的同页脚本与 devtools 求值中遮蔽 window.Audio 构造器，
// 全页无人使用 new Audio()，T9 按名调用 Audio.play/say/setFlags。
const Audio = (() => {
  let ctx = null, ok = true, lastSay = { t: 0, text: '' };
  let flags = { sound: true, voice: true };
  function init() { if (ctx || !ok) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { ok = false; } }
  function tone(freq, ms, type = 'sine', gain = .15) {
    if (!ok || !ctx || !flags.sound) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = gain;
    o.connect(g).connect(ctx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + ms / 1000);
    o.stop(ctx.currentTime + ms / 1000 + .02);
  }
  function play(n) {
    if (n === 'ding') { tone(1318, 180); tone(1760, 120); }
    if (n === 'pop') tone(523, 120, 'triangle');
    if (n === 'cheer') [880, 1108, 1318].forEach((f, i) => setTimeout(() => tone(f, 250), i * 120));
    if (n === 'windchime') [1568, 2093].forEach((f, i) => setTimeout(() => tone(f, 200, 'sine', .08), i * 90));
  }
  function say(text) {
    if (!flags.voice || !('speechSynthesis' in window)) return;
    const now = Date.now();
    if (text === lastSay.text && now - lastSay.t < 1500) return;
    lastSay = { t: now, text };
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = .9; u.pitch = 1.3;
    speechSynthesis.speak(u); // 不可用时浏览器静默
  }
  function setFlags(f) { flags = f; }
  window.addEventListener('pointerdown', init, { once: true });
  return { play, say, setFlags };
})();
/* === AUDIO END === */
</script>
<script>
/* === APP START === */
// 五屏状态机：开场/地图/游戏/庆祝/家长。只消费 ENGINE/STORE/VIEW/AUDIO，不改其锚段。
const PRAISE = ['真棒!', '就是这样!', '好厉害呀!'];
let praiseCursor = 0;

// 安全存储壳（spec§8 无痕可玩）：getItem/setItem 各包 try，失败回内存 Map。
// mem 恒镜像写入：某些无痕实现 setItem 抛错但 getItem 静默返回 null，
// 读时先查 mem 保证本会话进度可见。
const safeStorage = (() => {
  const mem = new Map();
  return {
    getItem(k) {
      if (mem.has(k)) return mem.get(k);
      try { return localStorage.getItem(k); } catch (e) { return null; }
    },
    setItem(k, v) {
      try { localStorage.setItem(k, v); } catch (e) { /* 无痕模式 */ }
      mem.set(k, v);
    },
    removeItem(k) {
      mem.delete(k);
      try { localStorage.removeItem(k); } catch (e) { /* 无痕模式 */ }
    },
  };
})();

const $ = s => document.querySelector(s);
// 地图 9 节点之字形定位表（[left%, top%]，自底向上，spec§4②）
const MAP_POS = [[10, 84], [13, 71], [15, 58], [56, 48], [20, 38],
  [24, 26], [44, 18], [62, 10], [76, 2]];

(() => {
  let level = null, cells = null, rule = null, sel = null, winTimer = null;
  let teach = null, teachIv = null, resetArmed = false, resetTimer = null;
  let epoch = 0; // doMatch 延迟回调据此丢弃已重建棋盘的旧动画（防误隐新盘同坐标活卡）

  const progress = () => loadProgress(safeStorage);
  const hintLeft = () => level && level.hint
    ? level.hint - (progress().hintUsed[level.id] || 0) : 0;

  /* 1. 屏幕切换 */
  function go(name) {
    document.querySelectorAll('#app > section').forEach(s =>
      s.classList.toggle('on', s.id === 'scr-' + name));
    if (name === 'open') {
      const p = progress();
      Audio.say(p.cleared.length === 9 ? '你已经是个连连看小高手啦!' : '我们来玩连连看吧!');
    }
    if (name === 'map') renderMap();
    if (name === 'parent') syncParent();
  }

  /* 2. 地图页（req6）：当前关=max(cleared)+1(≤9)；锁=可点不可进不惩罚 */
  function renderMap() {
    const p = progress();
    const cur = Math.min(9, p.cleared.length ? Math.max(...p.cleared) + 1 : 1);
    $('#scr-map .stars').textContent = '⭐ ' + p.cleared.length + '/9';
    const area = $('#scr-map .map-area');
    area.innerHTML = '';
    LEVELS.forEach((L, i) => {
      const done = p.cleared.includes(L.id);
      const current = L.id === cur && !done;
      const n = document.createElement('button');
      n.className = 'node' + (done ? ' done' : current ? ' current breathe' : ' locked');
      n.style.left = MAP_POS[i][0] + '%'; n.style.top = MAP_POS[i][1] + '%';
      n.textContent = done ? '⭐' : String(L.id);
      n.addEventListener('click', () => {
        if (done || current) startLevel(L.id);
        else { Audio.play('pop'); Audio.say('先过前面的关卡吧'); } // 不设惩罚锁
      });
      area.appendChild(n);
    });
  }

  /* 3. 进入关卡 */
  function startLevel(id) {
    epoch++;
    level = LEVELS[id - 1];
    const gen = generateBoard(level, Math.random);
    cells = gen.cells; rule = gen.rule; sel = null;
    View.buildGame(level);
    View.renderBoard(cells, tapCell);
    $('#scr-game .stars').textContent = '第 ' + level.id + ' 关';
    const hintBtn = $('#scr-game .hint');
    $('#scr-game .back').addEventListener('click', () => { clearTeach(); go('map'); });
    if (level.hint) {
      hintBtn.hidden = false;
      if (hintLeft() <= 0) hintBtn.classList.add('dim');
      hintBtn.addEventListener('click', useHint);
    }
    go('game');
    maybeTeach(); // req3：4/7 关一次性教学层
  }

  /* 4. tapCell 状态机（req1） */
  function tapCell(rc) {
    try {
      if (!level || !cells) return;
      const { r, c } = rc;
      if (cells[r][c] == null) return; // 已消除格静默忽略
      const el = View.cellEl(r, c);
      if (!sel) {
        clearGlow(); // 清掉提示灯残留的 .sel/.breathe
        sel = { r, c }; View.setSelected(el, true); Audio.play('ding');
        return;
      }
      if (sel.r === r && sel.c === c) { View.setSelected(el, false); sel = null; return; }
      const a = sel, b = { r, c };
      sel = null;
      const aEl = View.cellEl(a.r, a.c);
      View.setSelected(aEl, false); View.setSelected(el, false);
      const res = attempt(cells, level.rows, level.cols, rule, a, b);
      if (res.type === 'match') doMatch(a, b, res.path);
      else { // diff/blocked —— 无失败态铁律（spec§2）：只摇头+泡泡音，无红无✗无分数
        View.shake(aEl); View.shake(el);
        Audio.play('pop'); Audio.say('再找一个试试');
      }
    } catch (e) { console.error('tapCell', e); if (level) startLevel(level.id); } // spec§8 回初始盘面
  }

  function doMatch(a, b, path) {
    View.drawPath(path);
    cells[a.r][a.c] = null; cells[b.r][b.c] = null;
    const text = PRAISE[praiseCursor++ % PRAISE.length]; // 全局游标轮换鼓励语
    const ep = epoch;
    setTimeout(() => {
      if (ep !== epoch) return; // 棋盘已重建（退出重进/换关），旧动画作废
      const ea = View.cellEl(a.r, a.c), eb = View.cellEl(b.r, b.c);
      View.vanish(ea); View.vanish(eb); View.burst(ea); View.burst(eb);
      Audio.say(text);
      // spec§8 支持才震；userActivation 守卫：无真实用户激活时 Chrome 会报 console error
      if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive))
        navigator.vibrate(30);
      if (cells.flat().every(v => v == null)) { win(); return; }
      if (rule !== 'free' && !hasAvailablePair(cells, level.rows, level.cols, rule)) {
        // 洗牌救援（req1 尾）：死局自动重摆+翻转动画+救援语音
        cells = reshuffle(cells, level.rows, level.cols, rule, Math.random);
        View.renderBoard(cells, tapCell);
        cells.forEach((row, r) => row.forEach((v, c) => {
          if (v != null) View.cellEl(r, c).classList.add('reshuffle');
        }));
        Audio.say('老师帮你重新摆好啦，继续!');
        Audio.play('windchime');
      }
    }, 400);
  }

  /* 5. 过关庆祝（req2）：3s 自动推进；点击立即 */
  function advance() {
    clearTimeout(winTimer); winTimer = null;
    // 仅当庆祝页仍在展示才推进：防 3s 定时器与迟到点击双触发跳关
    if (!level || !$('#scr-win').classList.contains('on')) return;
    if (level.id >= 9) { level = null; go('open'); } // 9 关后回开场（语音已换高手版）
    else startLevel(level.id + 1);
  }
  function win() {
    if ($('#scr-win').classList.contains('on')) return; // 并发末对双触发防重
    markCleared(safeStorage, level.id);
    go('win'); // 先切 .on 再撒花（confetti 写入 #scr-win）
    $('#scr-win .win-text').textContent = '太棒啦!第' + level.id + '关完成!';
    View.confetti();
    Audio.play('cheer');
    Audio.say('太棒啦!第' + level.id + '关完成!');
    clearTimeout(winTimer);
    winTimer = setTimeout(advance, 3000);
  }

  /* 6. 新规则教学层（req3）：4/7 关各一次，hintUsed 记 taught:4/7 */
  const TEACH_LINE = { 4: '这次要找能连成线的哦', 7: '线最多拐两个弯!' };
  function clearGlow() {
    document.querySelectorAll('#board .card.breathe').forEach(x =>
      x.classList.remove('sel', 'breathe'));
  }
  function clearTeach() {
    if (teachIv) { clearInterval(teachIv); teachIv = null; }
    if (teach) { teach.remove(); teach = null; }
    const svg = $('#lines'); if (svg) svg.innerHTML = '';
    clearGlow();
  }
  function maybeTeach() {
    if (level.id !== 4 && level.id !== 7) return;
    const key = 'taught:' + level.id, p = progress();
    if (p.hintUsed[key]) return;
    p.hintUsed[key] = 1; saveProgress(safeStorage, p); // 先落盘：重进不再弹
    teach = document.createElement('div');
    teach.id = 'teach';
    teach.innerHTML = '<div>' + TEACH_LINE[level.id] + '</div>' +
      '<div style="font-size:16px">（点击跳过）</div>';
    $('#board-wrap').appendChild(teach);
    const pair = findHint(cells, level.rows, level.cols, rule);
    if (pair) { // 演示：高亮一对+示例彩虹线循环流动
      const res = attempt(cells, level.rows, level.cols, rule, pair[0], pair[1]);
      pair.forEach(pt => {
        const el = View.cellEl(pt.r, pt.c);
        el.classList.add('sel', 'breathe');
      });
      teachIv = setInterval(() => View.drawPath(res.path), 520);
      View.drawPath(res.path);
    }
    Audio.say(TEACH_LINE[level.id]);
    teach.addEventListener('click', fadeTeach); // 3s 自动或点击淡出
    setTimeout(fadeTeach, 3000);
  }
  function fadeTeach() {
    if (!teach) return;
    const t = teach; teach = null;
    if (teachIv) { clearInterval(teachIv); teachIv = null; }
    t.style.opacity = '0';
    setTimeout(() => { t.remove(); }, 360);
    const svg = $('#lines'); if (svg) svg.innerHTML = '';
    clearGlow();
  }

  /* 7. 提示灯（req4，7-9 关）：一次性，用后置灰 */
  function useHint() {
    try {
      if (!level || !level.hint || hintLeft() <= 0) return;
      const pair = findHint(cells, level.rows, level.cols, rule);
      if (!pair) return;
      pair.forEach(pt => {
        const el = View.cellEl(pt.r, pt.c);
        el.classList.add('sel', 'breathe');
      });
      const p = progress();
      p.hintUsed[level.id] = (p.hintUsed[level.id] || 0) + 1;
      saveProgress(safeStorage, p);
      $('#scr-game .hint').classList.add('dim'); // 用完 💡 置灰
      Audio.play('windchime');
    } catch (e) { console.error('useHint', e); }
  }

  /* 8. 家长门（req5）：Logo 长按 3s；pointermove>10px 或提前抬起即取消 */
  function wireParentGate() {
    const logo = $('#logo');
    let timer = null, sx = 0, sy = 0;
    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
    logo.addEventListener('contextmenu', e => e.preventDefault());
    logo.addEventListener('pointerdown', e => {
      sx = e.clientX; sy = e.clientY; cancel();
      timer = setTimeout(() => { timer = null; go('parent'); }, 3000);
    });
    logo.addEventListener('pointermove', e => {
      if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) cancel();
    });
    logo.addEventListener('pointerup', cancel);
    logo.addEventListener('pointercancel', cancel);
  }
  function setFlag(which, val) {
    const p = progress();
    p[which] = val; saveProgress(safeStorage, p);
    Audio.setFlags({ sound: p.sound, voice: p.voice }); // 两键恒齐传
  }
  function syncParent() {
    const p = progress();
    $('#pk-sound').checked = p.sound;
    $('#pk-voice').checked = p.voice;
    Audio.setFlags({ sound: p.sound, voice: p.voice });
  }
  function wireParentPage() {
    $('#pk-sound').addEventListener('change', e => setFlag('sound', e.target.checked));
    $('#pk-voice').addEventListener('change', e => setFlag('voice', e.target.checked));
    $('#pk-back').addEventListener('click', () => go('open'));
    const btn = $('#pk-reset');
    btn.addEventListener('click', () => { // 二次确认：连点两次才清
      if (!resetArmed) {
        resetArmed = true; btn.textContent = '确认清除全部进度?';
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => { resetArmed = false; btn.textContent = '重置进度'; }, 3000);
        return;
      }
      clearTimeout(resetTimer); resetArmed = false; btn.textContent = '重置进度';
      safeStorage.removeItem(STORE_KEY);
      go('open');
    });
  }

  /* 9. 装配 */
  function init() {
    View.decorate();
    const p = progress();
    Audio.setFlags({ sound: p.sound, voice: p.voice });
    $('#btn-start').addEventListener('click', () => go('map'));
    $('#map-back').addEventListener('click', () => go('open'));
    $('#scr-win').addEventListener('click', advance); // 庆祝页点击即推进
    wireParentGate(); wireParentPage();
    go('open');
  }
  globalThis.App = { go, startLevel, tapCell, win, useHint };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
/* === APP END === */
</script>
</body>
</html>
